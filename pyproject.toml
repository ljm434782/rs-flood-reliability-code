[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-reliability"
version = "0.1.0"
description = "Reproducible Sentinel-1/2 flood-mapping reliability study"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "torch>=2.4"]
train = ["torch>=2.4"]
impactmesh_audit = ["zarr==2.18.0", "numcodecs==0.15.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
